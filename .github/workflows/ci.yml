name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (gcc) — C++ и .NET тесты
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Сборка и все тесты (scripts/test-all.sh)
        run: bash scripts/test-all.sh

  windows:
    name: Windows (MSVC) — C++ и .NET тесты, сборка WPF
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Сборка (MSVC) и все тесты (scripts/test-all.ps1)
        shell: pwsh
        run: ./scripts/test-all.ps1

      - name: Сборка WPF-оболочки (dotnet/Glass.slnx)
        if: ${{ !cancelled() }}
        run: dotnet build dotnet/Glass.slnx -c Release --nologo

      - name: glass_capi.dll лежит рядом с GlassStudio.exe
        shell: pwsh
        run: |
          $dir = 'dotnet/Glass.Studio/bin/Release/net8.0-windows'
          foreach ($f in 'GlassStudio.exe', 'glass_capi.dll') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Нет $f в $dir" }
          }
