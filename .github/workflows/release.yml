name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Версия и проверка тега
        shell: bash
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' dotnet/Directory.Build.props | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::Не удалось прочитать <Version> из dotnet/Directory.Build.props"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Тег v$TAG_VERSION не совпадает с версией $VERSION в dotnet/Directory.Build.props"
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Версия: $VERSION"

      - name: Сборка (MSVC) и все тесты
        shell: pwsh
        run: ./scripts/test-all.ps1

      - name: Публикация Glass Studio (self-contained, win-x64)
        run: dotnet publish dotnet/Glass.Studio/Glass.Studio.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -p:DebugSymbols=false -o dist/GlassStudio

      - name: Состав пакета
        shell: bash
        run: |
          PKG="GlassStudio-$VERSION-win-x64"
          OUT="dist/$PKG"
          mkdir -p "$OUT"
          cp -r dist/GlassStudio "$OUT/GlassStudio"
          cp build/Release/glass_capi.dll "$OUT/GlassStudio/"
          cp build/Release/glassc.exe "$OUT/"
          cp -r examples "$OUT/examples"
          if [ -d docs ]; then cp -r docs "$OUT/docs"; fi
          cp LICENSE README.md CHANGELOG.md THIRD-PARTY-NOTICES.md glass-grammar.md "$OUT/"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Проверка пакета (файлы на месте, glassc запускается)
        shell: bash
        run: |
          OUT="dist/$PKG"
          for f in GlassStudio/GlassStudio.exe GlassStudio/glass_capi.dll glassc.exe examples/shapes.glass LICENSE; do
            test -f "$OUT/$f" || { echo "::error::В пакете нет $f"; exit 1; }
          done
          "$OUT/glassc.exe" "$OUT/examples/shapes.glass"

      - name: Текст релиза из CHANGELOG.md
        shell: bash
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Glass $VERSION" > release-notes.md; fi
          cat release-notes.md

      - name: Архив
        shell: pwsh
        run: Compress-Archive -Path "dist/${env:PKG}" -DestinationPath "dist/${env:PKG}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: GlassStudio-${{ env.VERSION }}-win-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: Создать GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/$PKG.zip" --title "Glass $VERSION" --notes-file release-notes.md $PRERELEASE
